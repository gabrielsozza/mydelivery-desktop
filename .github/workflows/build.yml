# Gera os instaladores (Windows/Mac) + o APK Android na nuvem (grátis) e
# PUBLICA tudo num Release público a cada tag (ex: v1.0.4). O electron-builder
# sobe os instaladores + metadados de auto-update (latest.yml/latest-mac.yml);
# o job android sobe o MyDelivery.apk. Nomes de arquivo fixos → os links de
# download da landing continuam valendo.
name: build-desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Um tropeço num SO não cancela o build do outro.
      fail-fast: false
      matrix:
        # macos-13 é a imagem estável pro dmgbuild — a macos-latest nova quebra
        # ao montar o 2º DMG (arm64) no mesmo volume /Volumes/MyDelivery.
        os: [windows-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build + publicar (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + publicar (macOS)
        if: startsWith(matrix.os, 'macos')
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    # App Android nativo (WebView em tela cheia) — APK assinado.
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Decodificar keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"
      - name: Build APK assinado
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Preparar APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK encontrado: $APK"
          cp "$APK" MyDelivery.apk
          ls -la MyDelivery.apk
      - name: Anexar APK ao rascunho do Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: MyDelivery.apk
          fail_on_unmatched_files: true
          draft: true   # mantém rascunho até o job publish liberar

  publish:
    # Só torna o Release PÚBLICO (latest) quando Win + Mac + APK terminaram OK.
    # Se qualquer um falhar, o rascunho fica invisível e o /latest continua no
    # último release completo — nunca cai num release pela metade (fim do 404).
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publicar (tirar do rascunho + marcar latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" -R "${{ github.repository }}" --draft=false --latest
