# Gera os instaladores na nuvem (grátis) e PUBLICA um Release público a cada
# tag (ex: v1.0.3). O electron-builder sobe os instaladores + os metadados de
# auto-update (latest.yml / latest-mac.yml) — é o que faz o app se atualizar
# sozinho no Windows e avisar no Mac. Os nomes de arquivo são fixos, então os
# links de download da landing continuam valendo.
name: build-desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build + publicar (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + publicar (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
