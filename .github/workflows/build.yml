# Gera os instaladores automaticamente na nuvem (grátis) — você está no Mac,
# então o .exe do Windows sai daqui sem precisar de uma máquina Windows.
# Ao criar uma tag (ex: v1.0.0), além de gerar os builds, PUBLICA um Release
# público com os instaladores — daí os links de download da landing funcionam
# em 1 clique (releases/latest/download/MyDelivery-Setup.exe, etc.).
name: build-desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar instaladores dos builds
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publicar Release público com os instaladores
        uses: softprops/action-gh-release@v2
        with:
          name: MyDelivery ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
