plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.mydeliveryfood.entregador'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.mydeliveryfood.entregador"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 2.5.0 is the stable line compatible with compileSdk 34. The 2.6.x
    // releases pull AndroidX Browser 1.9 alpha and require SDK/AGP 36.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
